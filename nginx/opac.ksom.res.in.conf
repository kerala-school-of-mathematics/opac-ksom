# Nginx Reverse Proxy Configuration for KSoM Library OPAC
# Place in /etc/nginx/sites-available/opac.ksom.res.in and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name opac.ksom.res.in;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name opac.ksom.res.in;

    # SSL Certificates (Managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/opac.ksom.res.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opac.ksom.res.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Optional: Serve landing portal directly from root if hosted together
    # root /var/www/opac;
    # index index.html;

    # Reverse Proxy to Koha Backend
    location / {
        proxy_pass http://210.212.228.235:80;
        proxy_set_header Host opac.ksom.res.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Disable buffering for real-time response
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;

        # Rewrite redirect headers to keep users on opac.ksom.res.in
        proxy_redirect http://210.212.228.235/ https://opac.ksom.res.in/;
        proxy_redirect http://opac.ksom.res.in/ https://opac.ksom.res.in/;
    }
}

